<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>正在退出 DSH Desktop</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        padding: 22px 24px;
        border: 1px solid #2a3140;
        background: #161a22;
        color: #e6e9ef;
        font: 14px/1.5 "Microsoft YaHei", system-ui, sans-serif;
        cursor: default;
        user-select: none;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 12px;
        color: #8b93a4;
      }
      .track {
        height: 4px;
        border-radius: 2px;
        background: #232a36;
        overflow: hidden;
      }
      /* Indeterminate: the wait is bounded but its length is not knowable
         up front — the harness may flush in a second or use the full grace. */
      .bar {
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        animation: march 1.1s ease-in-out infinite;
      }
      @keyframes march {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <h1>正在退出 DSH Desktop</h1>
    <div class="track"><div class="bar"></div></div>
    <p>正在等待 DeepSeek Harness 保存并退出，请勿强制结束进程。</p>
  </body>
</html>
