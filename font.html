<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>选择字体</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 16px 16px 14px;
        background: #161a22;
        color: #e6e9ef;
        font: 14px/1.45 "Microsoft YaHei", system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 600;
      }
      input[type="search"] {
        box-sizing: border-box;
        width: 100%;
        margin-bottom: 10px;
        padding: 8px 10px;
        border: 1px solid #2a3140;
        border-radius: 6px;
        background: #1c222c;
        color: inherit;
        font: inherit;
        outline: none;
      }
      input[type="search"]:focus {
        border-color: #3b82f6;
      }
      #status {
        margin: 0 0 8px;
        font-size: 12px;
        color: #8b93a4;
      }
      #list {
        flex: 1;
        min-height: 0;
        overflow: auto;
        border: 1px solid #2a3140;
        border-radius: 6px;
        background: #12161d;
      }
      button.row {
        display: block;
        width: 100%;
        padding: 7px 12px;
        border: 0;
        border-bottom: 1px solid #232a36;
        background: transparent;
        color: inherit;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
      }
      button.row:hover {
        background: #1c2430;
      }
      button.row[aria-selected="true"] {
        background: #243044;
      }
      #preview {
        margin: 10px 0 12px;
        padding: 10px 12px;
        min-height: 72px;
        border: 1px solid #2a3140;
        border-radius: 6px;
        background: #12161d;
        font-size: 18px;
        line-height: 1.5;
        word-break: break-word;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .actions button {
        min-width: 88px;
        padding: 7px 14px;
        border: 1px solid #2a3140;
        border-radius: 6px;
        background: #232a36;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .actions button.primary {
        border-color: #2563eb;
        background: #1d4ed8;
      }
      .actions button:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <h1>选择字体</h1>
    <input type="search" id="search" placeholder="搜索字体…" autocomplete="off" />
    <p id="status">正在读取系统字体…</p>
    <div id="list" role="listbox" aria-label="系统字体"></div>
    <div id="preview">DeepSeek Harness 字体预览 0123456789 The quick brown fox</div>
    <div class="actions">
      <button type="button" id="cancel">取消</button>
      <button type="button" id="apply" class="primary">应用</button>
    </div>
    <script type="module" src="/src/font.ts"></script>
  </body>
</html>
